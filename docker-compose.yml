# Optional local Postgres. Skip this file when PostgreSQL is already installed.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - booking_postgres:/var/lib/postgresql/data

volumes:
  booking_postgres:
